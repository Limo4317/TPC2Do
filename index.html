<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1f2430; --muted:#6b7280; --line:#d9dde3; --head:#eef1f5;
  --accent:#2563eb; --accent-text:#fff; --danger:#dc2626; --done:#9aa1ad; --hover:#f3f6fb; --shadow:0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161a; --panel:#1c1f26; --text:#e6e8ec; --muted:#98a0ad; --line:#333844; --head:#242833;
        --accent:#5b8cff; --accent-text:#0b1020; --danger:#f26d6d; --done:#6b7280; --hover:#232834; --shadow:0 8px 30px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em}
.muted{color:var(--muted)} .small{font-size:12.5px}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .gap{gap:14px} .wrapx{flex-wrap:wrap}

/* Topbar */
.top{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:.02em;color:var(--text)} .brand:hover{text-decoration:none}
.tile{display:grid;place-items:center;background:#000;color:#fff;border-radius:9px;width:36px;height:36px}
.tile svg{width:26px;height:auto;display:block}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);padding:3px 8px 3px 3px;border-radius:99px} .me:hover{background:var(--hover);text-decoration:none}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-text);font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 60px} .wrap.wide{max-width:1500px} .wrap.narrow{max-width:640px}
@media (max-width:600px){.me span{display:none}}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--hover)} .btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;font-weight:600} .btn.danger.solid:hover{filter:brightness(1.08);background:var(--danger)}
.icon{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;opacity:.55} .icon:hover{opacity:1;background:var(--hover)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 2px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* Formulare */
label{display:block;margin:0 0 12px;font-weight:600;font-size:13.5px}
label input,label select{display:block;width:100%;margin-top:4px;font-weight:400}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input:disabled{opacity:.65}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
small{color:var(--muted);font-weight:400}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}

/* Auth */
.auth{max-width:400px;margin:5vh auto;padding:26px 28px 28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.logo-lock{display:flex;flex-direction:column;align-items:center;gap:4px;background:#000;color:#fff;border-radius:18px;padding:18px 28px 12px;width:fit-content;margin:0 auto 14px}
.logo-lock svg{width:110px;height:auto;display:block}
.logo-lock b{font:900 44px/1 "Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;letter-spacing:.03em}
.auth .tagline{text-align:center;margin:0 0 6px}
.langsel{display:flex;justify-content:flex-end;margin:-8px 0 6px} .langsel select{padding:3px 6px;font-size:13px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.notice{background:var(--head);border-radius:8px;padding:9px 12px;margin:12px 0;font-size:14px}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--danger)} .msg.ok{color:#16a34a} .msg.inline{margin:0}

/* Panels (Account) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.panel h3{font-size:16px;margin-bottom:12px}

/* Listenübersicht */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16px;margin:0 0 4px;padding-right:28px;word-break:break-word}
.card .icon{position:absolute;top:8px;right:8px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);margin:10px 0 28px}

/* Brotkrumen + Titel */
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.h-input{font-size:24px;font-weight:700;border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;width:min(560px,80vw)}
.h-input:hover{border-color:var(--line)}
h2{font-size:24px}

/* Tabelle */
.sheet-wrap{margin-top:14px;overflow:auto;max-height:calc(100vh - 225px);min-height:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top;background:var(--panel)}
.sheet th{position:sticky;top:0;z-index:2;background:var(--head);font-size:13px;text-align:left;padding:8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet th .colbtn{border:0;background:none;cursor:pointer;float:right;opacity:.6;padding:0 4px;font-size:15px;line-height:1}
.sheet th .colbtn:hover{opacity:1}
.sheet th.c-chk,.sheet td.c-chk{text-align:center}
.sheet td.c-chk{padding-top:9px}
.sheet td.c-chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.sheet tr:hover td{background:var(--hover)}
.sheet textarea,.sheet td input[type=text],.sheet td input[type=number],.sheet td input[type=date]{
  width:100%;border:0;border-radius:0;background:transparent;padding:8px;resize:none;overflow:hidden;display:block;min-height:36px}
.sheet textarea:focus,.sheet td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel)}
.sheet td.c-bool{text-align:center;padding-top:9px} .sheet td.c-bool input{width:18px;height:18px;accent-color:var(--accent)}
.sheet td.c-sub{padding:7px 8px}
.sheet td.c-add{text-align:center}
.sheet tr.done textarea,.sheet tr.done input[type=number],.sheet tr.done input[type=date]{color:var(--done)}
.sheet tr.done textarea[data-f=title]{text-decoration:line-through}
.sheet tr.addrow td{padding:6px 10px} .sheet tr.addrow:hover td{background:var(--panel)}
.sheet tr.sep td{background:var(--head);font-size:12.5px;color:var(--muted);padding:5px 10px;font-weight:600}
.sheet tr.ctxrow td{background:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--head);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.lock{color:var(--muted)}
.sheet td.c-sub .icon{padding:1px 4px}

/* Kontextmenü */
.ctx{position:fixed;z-index:150;min-width:230px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer}
.ctx button:hover,.ctx button:focus{background:var(--hover);outline:none}
.ctx button.danger{color:var(--danger)}
.ctx .ic{width:18px;text-align:center;opacity:.8}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px;z-index:100;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;width:100%;max-width:520px}
.modal.small-modal{max-width:400px}
.modal h3{font-size:18px} .modal h4{margin:18px 0 6px;font-size:14px}
.actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;margin:8px 0 12px}
.pickitem{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer}
.pickitem:hover{border-color:var(--accent)}
.members{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.member{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.member span.nm{flex:1;word-break:break-all}
.linkrow{display:flex;gap:6px;margin-top:8px} .linkrow input{flex:1;min-width:0}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:200;display:none;align-items:center;gap:14px;max-width:90vw;box-shadow:var(--shadow)}
#toast.err{background:var(--danger);color:#fff}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* Priority / due date */
.sheet td.c-prio{padding:0}
.sheet td.c-prio select{width:100%;border:0;border-left:5px solid transparent;border-radius:0;background:transparent;padding:8px 6px;min-height:36px;cursor:pointer}
.sheet td.c-prio select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel)}
.sheet td.c-prio.p1 select{border-left-color:#94a3b8}
.sheet td.c-prio.p2 select{border-left-color:#3b82f6}
.sheet td.c-prio.p3 select{border-left-color:#eab308}
.sheet td.c-prio.p4 select{border-left-color:#f97316}
.sheet td.c-prio.p5 select{border-left-color:#dc2626}
.sheet td.c-prio.p0 select{color:var(--muted)}
.sheet td.c-due.over{background:color-mix(in srgb,var(--danger) 13%,var(--panel))}
.sheet td.c-due.over input{color:var(--danger);font-weight:600}
.sheet td.c-due.today{background:color-mix(in srgb,#f97316 15%,var(--panel))}
.sheet td.c-due.today input{color:#c2410c;font-weight:600}
@media (prefers-color-scheme:dark){.sheet td.c-due.today input{color:#fdba74}}
.sheet tr.done td.c-due.over,.sheet tr.done td.c-due.today{background:var(--panel)}

/* Intro / Splash */
#splash{position:fixed;inset:0;z-index:1000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-stage{display:flex;flex-direction:column;align-items:center;gap:2px}
.sp-bird{width:min(54vw,320px);height:auto;display:block;transform:translateY(-120vh);animation:spDrop .9s .1s forwards}
.sp-word{display:flex;font:900 clamp(72px,19vw,170px)/1 "Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;letter-spacing:.02em}
.sp-2{display:block;transform:translateX(-58vw);animation:spL .55s .85s forwards}
.sp-do{display:block;transform:translateX(58vw);animation:spR .55s .85s forwards}
.sp-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#splash.hit .sp-stage{animation:spShake .42s}
#splash.hit .sp-flash{animation:spFlash .4s}
@keyframes spDrop{
  0%{transform:translateY(-120vh);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  60%{transform:translateY(0);animation-timing-function:ease-out}
  76%{transform:translateY(-3.5vh);animation-timing-function:ease-in}
  88%{transform:translateY(0);animation-timing-function:ease-out}
  94%{transform:translateY(-.8vh);animation-timing-function:ease-in}
  100%{transform:translateY(0)}}
@keyframes spL{0%{transform:translateX(-58vw);animation-timing-function:cubic-bezier(.45,0,.85,.55)}72%{transform:translateX(0);animation-timing-function:ease-out}84%{transform:translateX(9px);animation-timing-function:ease-in-out}100%{transform:translateX(0)}}
@keyframes spR{0%{transform:translateX(58vw);animation-timing-function:cubic-bezier(.45,0,.85,.55)}72%{transform:translateX(0);animation-timing-function:ease-out}84%{transform:translateX(-9px);animation-timing-function:ease-in-out}100%{transform:translateX(0)}}
@keyframes spShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,1px)}}
@keyframes spFlash{0%{opacity:.4}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none!important;transform:none!important}
}

/* column menu, formulas, import dialog */
.ctx .arr{opacity:.6;margin-left:auto} .ctx button.hassub{padding-right:10px}
.ctxsub{position:absolute;left:100%;top:0;margin-left:3px;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:2}
.ctxsub button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:inherit;font:inherit}
.ctxsub button:hover,.ctxsub button:focus{background:var(--hover);outline:none}
.ctxsub .ic{width:18px;text-align:center;opacity:.8}
.fx{opacity:.6;font-style:italic;font-family:var(--mono)}
.sheet td.c-calc{text-align:right;padding:9px 12px;font-variant-numeric:tabular-nums;color:var(--text);cursor:default}
.sheet td.c-calc.err{color:var(--danger);font-size:12.5px}
.sheet tfoot td{position:sticky;bottom:0;background:var(--head);border-top:2px solid var(--line);padding:7px 12px;font-weight:600;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
main.full .sheet tfoot td{position:static}
.impwrap{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:10px;margin:8px 0}
table.imp{border-collapse:collapse;font-size:13px} table.imp th,table.imp td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;min-width:140px}
table.imp th{background:var(--head)} table.imp .ih{font-weight:600;margin-bottom:4px;white-space:nowrap} table.imp td{color:var(--muted);white-space:nowrap}
.modal.wide{max-width:min(860px,94vw)}
.actions.wrapx{flex-wrap:wrap}
.sheet td:not(.c-chk):not(.c-bool):not(.c-calc):focus-within{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel)}
.sheet td textarea:focus,.sheet td input:not([type=checkbox]):focus,.sheet td.c-prio select:focus{outline:none;background:transparent}
.sheet td:has(textarea),.sheet td:has(input[type=text]),.sheet td:has(input[type=number]),.sheet td:has(input[type=date]){cursor:text}
:root[data-theme="modern"] .sheet td:not(.c-chk):not(.c-bool):not(.c-calc):focus-within{background:rgba(94,234,212,.06)}
:root[data-theme="glass"] .sheet td:not(.c-chk):not(.c-bool):not(.c-calc):focus-within{background:rgba(255,255,255,.14)}
:root[data-theme="glass"] .ctxsub{background:rgb(32,52,122);border-color:rgba(255,255,255,.3)}
:root[data-theme="glass"] .sheet tfoot td{background:rgba(40,64,140,.55)}
/* column resize handle + full-screen layout */
.sheet td.c-chk{position:relative} .rep{position:absolute;right:2px;top:2px;font-size:10px;opacity:.75;line-height:1}
.sheet tr.sep.tog{cursor:pointer;user-select:none} .sheet tr.sep.tog:hover td{color:var(--text)} .sheet tr.sep.tog .car{display:inline-block;width:1em}
.sheet tr.sep.tog:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.search{width:100%;font-size:15px;padding:10px 14px;border-radius:99px;margin:0 0 14px}
.sres h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
.shit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;margin:0 0 6px;cursor:pointer}
.shit:hover{border-color:var(--accent)} .shit .where{font-size:12px;color:var(--muted)} .shit .sn{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shit.d .tt{text-decoration:line-through;color:var(--done)} mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sheet th{position:sticky}
.rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:3}
.rz:hover,body.resizing .rz{background:linear-gradient(90deg,transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px)}
body.resizing{cursor:col-resize;user-select:none}
.iconbtn.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#statusbar{margin:8px 0 0}
main.full.wrap{max-width:none;padding:12px 14px 54px}
main.full .sheet-wrap{max-height:none;overflow:visible;min-height:0}
main.full .sheet th{top:var(--top-h,53px)}
main.full #statusbar{position:fixed;left:0;right:0;bottom:0;margin:0;padding:7px 16px;z-index:30;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* ===== Themes & appearance ===== */
:root{--sb-thumb:color-mix(in srgb,var(--muted) 55%,transparent)}
:root[data-theme="modern"]{--sb-thumb:color-mix(in srgb,var(--accent) 45%,transparent)}
:root[data-theme="glass"]{--sb-thumb:rgba(255,255,255,.45)}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}
::-webkit-scrollbar{width:11px;height:11px} ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box}
:root{--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color-scheme:light dark}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:34px;padding:0;font-size:17px;text-decoration:none}
.iconbtn:hover{text-decoration:none}
/* settings page */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.theme-opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer}
.theme-opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.theme-opt.sel{border-color:var(--accent)}
.theme-opt b{display:block;font-size:14px} .theme-opt small{display:block;line-height:1.3;margin-top:2px}
.dots{display:flex;flex:none}
.dots i{width:20px;height:34px;border:1px solid rgba(128,128,128,.45);margin-right:-1px}
.dots i:first-child{border-radius:8px 0 0 8px} .dots i:last-child{border-radius:0 8px 8px 0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 12px;flex-wrap:wrap}
.setrow>span{font-weight:600;font-size:13.5px}
.setrow select{width:auto;margin:0}
.setrow input[type=color]{width:46px;height:32px;padding:2px;border-radius:8px;cursor:pointer}
.hint{margin:-6px 0 12px 28px}
/* density + text size */
:root[data-font="s"] body{font-size:13.5px} :root[data-font="l"] body{font-size:17px}
:root[data-density="compact"] .sheet textarea,:root[data-density="compact"] .sheet td input[type=text],:root[data-density="compact"] .sheet td input[type=number],:root[data-density="compact"] .sheet td input[type=date]{padding:4px 8px;min-height:28px}
:root[data-density="compact"] .sheet td.c-prio select{padding:4px 6px;min-height:28px}
:root[data-density="compact"] .sheet td.c-chk,:root[data-density="compact"] .sheet td.c-bool{padding-top:5px}
:root[data-density="compact"] .sheet td.c-sub{padding:3px 8px}
:root[data-density="comfy"] .sheet textarea,:root[data-density="comfy"] .sheet td input[type=text],:root[data-density="comfy"] .sheet td input[type=number],:root[data-density="comfy"] .sheet td input[type=date]{padding:13px 10px;min-height:48px}
:root[data-density="comfy"] .sheet td.c-prio select{padding:13px 6px;min-height:48px}
:root[data-density="comfy"] .sheet td.c-chk,:root[data-density="comfy"] .sheet td.c-bool{padding-top:15px}
:root[data-density="comfy"] .sheet td.c-sub{padding:13px 8px}
/* ---- Light ---- */
:root[data-theme="light"]{color-scheme:light;--bg:#ebeae2;--panel:#f7f6f0;--text:#131824;--muted:#6b6d5c;--line:#c9c7b3;--head:#dedcd0;--accent:#175cc2;--accent-text:#eaf1fc;--danger:#b23b30;--done:#8c8e7c;--hover:#eceae0;--shadow:0 8px 30px rgba(40,38,20,.2)}
:root[data-theme="light"] .sheet td.c-due.today input{color:#c2410c}
:root[data-theme="light"] .msg.ok{color:#16a34a}
/* ---- Dark ---- */
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0a0a;--panel:#161616;--text:#f2f2f2;--muted:#8a8a8a;--line:#2c2c2c;--head:#1f1f1f;--accent:#fff;--accent-text:#14151d;--danger:#e0604f;--done:#6b6b6b;--hover:#202020;--shadow:0 8px 30px rgba(0,0,0,.75)}
:root[data-theme="dark"] .tile,:root[data-theme="dark"] .logo-lock{border:1px solid #2c2c2c}
/* ---- Modern (console look, lightly frosted) ---- */
:root[data-theme="modern"]{color-scheme:dark;--bg:#0d1416;--panel:rgba(20,29,33,.84);--text:#dfe9ea;--muted:#6d8288;--line:#233034;--head:rgba(25,42,44,.92);--accent:#5eead4;--accent-text:#06302a;--danger:#e0453f;--done:#56696f;--hover:rgba(94,234,212,.07);--shadow:0 10px 34px rgba(0,0,0,.55)}
:root[data-theme="modern"] body{background:radial-gradient(900px 500px at 85% 0%,rgba(94,234,212,.09),transparent 60%),radial-gradient(1200px 600px at 50% -10%,#16302c 0%,#0d1416 55%) fixed}
:root[data-theme="modern"] :is(h1,h2,h3,h4,.brand,.h-input,.crumbs,.sheet th,.badge,.btn,.tabs button){font-family:var(--mono)}
:root[data-theme="modern"] .sheet th{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:var(--accent)}
:root[data-theme="modern"] :is(.top,.panel,.auth,.card,.modal,.ctx,.sheet-wrap){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root[data-theme="modern"] :is(.panel,.auth,.card,.modal,.sheet-wrap,.ctx){border-radius:10px}
:root[data-theme="modern"] .sheet th,:root[data-theme="modern"] .sheet td{background:transparent}
:root[data-theme="modern"] .sheet th{background:var(--head)}
:root[data-theme="modern"] .sheet tr.sep td{background:var(--head)}
:root[data-theme="modern"] .sheet tr.addrow:hover td{background:transparent}
:root[data-theme="modern"] .sheet textarea:focus,:root[data-theme="modern"] .sheet td input:focus,:root[data-theme="modern"] .sheet td.c-prio select:focus{background:rgba(94,234,212,.06)}
:root[data-theme="modern"] .btn.primary{box-shadow:0 0 0 1px rgba(94,234,212,.45),0 0 18px rgba(94,234,212,.2)}
:root[data-theme="modern"] .card:hover{box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(94,234,212,.15)}
:root[data-theme="modern"] .overlay{background:rgba(3,8,9,.6)}
:root[data-theme="modern"] .sheet td.c-due.today input{color:#fdba74}
:root[data-theme="modern"] .logo-lock,:root[data-theme="modern"] .tile{border:1px solid #233034}
/* ---- Glass (layered: coloured light, blur + saturation, specular edges; real refraction in Chromium) ---- */
:root[data-theme="glass"]{color-scheme:dark;--bg:#13224a;--panel:rgba(255,255,255,.10);--text:#fff;--muted:rgba(255,255,255,.74);--line:rgba(255,255,255,.26);--head:rgba(255,255,255,.15);--accent:#00deff;--accent-text:#04233a;--danger:#ff7066;--done:rgba(255,255,255,.5);--hover:rgba(255,255,255,.13);--shadow:0 14px 44px rgba(6,12,45,.4);
  --glass-filter:blur(16px) saturate(185%) brightness(1.1)}

let audioCtx = null;

  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

async function setSession(session) {
  state.user = session ? session.user : null;
  state.profile = null; state.lists = []; state.memberRoles = {}; state.owners = {}; state.cur = null;
  if (state.user) {
    const mp = state.user.user_metadata && state.user.user_metadata.prefs;
    if (mp) { adoptPrefs(mp); try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} applyLang(); applyAppearance(); }
    const { data } = await sb.from('profiles').select('id,username,avatar').eq('id', state.user.id).maybeSingle();
    state.profile = data || { id: state.user.id, username: state.user.email };
    await loadLists();
  }
  state.ready = true;
}
function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
  if (sb && state.user) sb.auth.updateUser({ data: { prefs: { ...prefs } } }).then(r => { if (r.data && r.data.user) state.user = r.data.user; });
}

if (!sb) {
  renderSetup(); appReady();
} else {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { recoveryMode = true; if (state.ready) setTimeout(route, 0); }
    // don't await Supabase calls inside this callback → defer to the next tick
    setTimeout(async () => {
      const next = session ? session.user.id : null;
      const prev = state.user ? state.user.id : null;
      if (state.ready && prev === next) return;
      await setSession(session);
      try { await route(); } finally { appReady(); }
    }, 0);
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else refreshCur(true); });
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('focusout', () => { setTimeout(() => { if (state.needsRefresh) refreshCur(true); }, 60); });
}

async function loadLists() {
  const [l, m] = await Promise.all([
    sb.from('lists').select(LIST_COLS).order('created_at'),
    sb.from('list_members').select('list_id,role').eq('user_id', state.user.id)
  ]);
  if (l.error) { toast(errText(l.error), true); return; }
  state.lists = l.data || [];
  state.memberRoles = Object.fromEntries((m.data || []).map(x => [x.list_id, x.role]));
  const ids = [...new Set(state.lists.map(x => x.owner_id))].filter(id => id !== state.user.id && !state.owners[id]);
  if (ids.length) {
    const p = await sb.from('profiles').select('id,username').in('id', ids);
    (p.data || []).forEach(x => { state.owners[x.id] = x.username; });
  }
}
const roleOf = l => l.owner_id === state.user.id ? 'owner' : (state.memberRoles[l.id] || 'view');

/* ---------- Routing ---------- */
async function route() {
  if (!state.ready) return;
  closeCtx();
  const seq = ++state.routeSeq;
  stopPolling(); flushAll();
  const [name, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (recoveryMode && state.user) return renderRecovery();
  if (name === 'join' && arg) {
    if (!state.user) { sessionStorage.setItem('pendingJoin', arg); return renderAuth(T('join_hint')); }
    return doJoin(arg);
  }
  if (!state.user) return renderAuth();
  const pj = sessionStorage.getItem('pendingJoin');
  if (pj) { sessionStorage.removeItem('pendingJoin'); return doJoin(pj); }
  if (name === 'settings') { state.crumbs = []; state.cur = null; return renderSettings(); }
  if (name === 'account') { state.crumbs = []; state.cur = null; return renderAccount(); }
  if (name === 'list' && arg) {
    if (!state.keepCrumbs) state.crumbs = [];
    state.keepCrumbs = false;
    return renderList(arg, seq);
  }
  state.crumbs = []; state.cur = null;
  renderHome();
}

  await loadLists();
  location.hash = '#/list/' + data;
}

          <small>${TE('username_hint')}</small></label>` : ''}

        <div id="authMsg" class="msg"></div>
        ${mode === 'login' ? `<button type="button" class="linkbtn" id="toForgot">${TE('forgot')}</button>` : ''}

      </form></div>`;
    $('#langSel').onchange = e => { prefs.lang = e.target.value; applyLang(); savePrefs(); draw(); };
    app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    const tf = $('#toForgot'); if (tf) tf.onclick = () => { mode = 'forgot'; draw(); };

      const f = new FormData(form), email = f.get('email').trim(), password = f.get('password');
      btn.disabled = true; out.className = 'msg'; out.textContent = '';
      try {
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else if (forgot) {
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
          if (error) throw error;
          out.className = 'msg ok'; out.textContent = T('reset_sent');
        } else {
          const username = f.get('username').trim();
          if (!/^[A-Za-z0-9_.-]{3,24}$/.test(username)) throw new Error(T('err_username_invalid'));
          const av = await sb.rpc('username_available', { uname: username });
          if (av.error) throw av.error;
          if (!av.data) throw new Error(T('err_username_taken'));
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, prefs: { ...prefs } }, emailRedirectTo: pageUrl() } });

function queueSave(id, patch, delay = 600) {

function parseCsv(text) {

  const map = []; let hasTask = false, hasDone = false, hasNotes = false;
  for (let i = 0; i < n; i++) {

    else if (CSV_ALIAS.task.has(h) && !hasTask) { m = 'task'; hasTask = true; }

  if (!hasTask) for (let i = 0; i < n; i++) if (map[i] === 'skip' && vals(i).length && !boolish(vals(i))) { map[i] = 'task'; hasTask = true; break; }
  if (!hasNotes) for (let i = 0; i < n; i++) if (map[i] === 'skip' && vals(i).length && !boolish(vals(i))) { map[i] = 'notes'; hasNotes = true; break; }

async function importCsvText(text) {

  if (hr >= 0) {
    const map = guessMap(rows, hr);
    if (map.includes('task')) return doImport(rows, hr, map, map.filter((v, i) => v === 'skip' && norm(rows[hr][i]) !== '').length);

async function doImport(rows, hr, map, skipped) {

  if (data.length > CSV_MAX) return toast(T('csv_too_many', { max: CSV_MAX }), true);
  const newCols = [];
  map = map.map((m, i) => {
    if (m !== 'new') return m;
    const vals = data.map(r => String(r[i] == null ? '' : r[i]).trim()).filter(Boolean);
    let type = 'text';
    if (vals.length && vals.every(v => v !== '' && !isNaN(Number(v.replace(',', '.'))))) type = 'number';
    else if (vals.length && vals.every(v => toIsoDate(v))) type = 'date';
    const c = { id: newColId(), name: (String(head[i] || '').trim() || (T('imp_col') + ' ' + (i + 1))).slice(0, 40), type }; newCols.push(c); return 'col:' + c.id;
  });
  if (newCols.length && !(await saveColumns([...cloneCols(), ...newCols]))) return;
  const colOf = id => effCols().find(c => c.id === id);
  let pos = state.tasks.reduce((mx, x) => Math.max(mx, x.position), 0);
  const now = new Date().toISOString();
  const made = data.map(r => {
    const t = { id: uuid(), list_id: state.cur.id, done: false, title: '', notes: '', sub_list_id: null, data: {}, position: 0, created_at: now, done_at: null };
    map.forEach((k, i) => {
      if (k === 'skip') return; const v = r[i] == null ? '' : String(r[i]);
      if (k === 'done') t.done = TRUTHY.has(norm(v));
      else if (k === 'task') t.title = csvUnsafe(v.trim());
      else if (k === 'notes') t.notes = csvUnsafe(v.trim());
      else if (k.startsWith('col:')) { const c = colOf(k.slice(4)); if (!c) return; const val = coerceCell(c, v); if (val !== undefined) t.data[c.id] = val; }

  for (let i = 0; i < made.length; i += 200) {
    const chunk = made.slice(i, i + 200).map(t => ({ id: t.id, list_id: t.list_id, position: t.position, done: t.done, done_at: t.done_at, title: t.title, notes: t.notes, data: t.data }));

/* ---------- Sharing ---------- */
async function loadMembers(lid) {
  const r = await sb.from('list_members').select('user_id,role').eq('list_id', lid);
  const rows = r.data || []; if (!rows.length) return [];
  const p = await sb.from('profiles').select('id,username,avatar').in('id', rows.map(x => x.user_id));
  const by = Object.fromEntries((p.data || []).map(x => [x.id, x]));
  return rows.map(x => ({ ...x, username: (by[x.user_id] || {}).username || '?', avatar: (by[x.user_id] || {}).avatar }))
    .sort((a, b) => a.username.localeCompare(b.username));
}

    state.profile.avatar = dataUrl; renderAccount();
  }

    const out = $('#unameMsg'), v = $('#unameIn').value.trim(); out.className = 'msg inline'; out.textContent = '';

  };

  $('#prefAccent').onchange = e => { prefs.accent = e.target.value; change(); };
  $('#accentReset').onclick = e => { prefs.accent = ''; change(); e.target.disabled = true; $('#prefAccent').value = '#2563eb'; };
  $('#prefDensity').onchange = e => { prefs.density = e.target.value; change(); };
  $('#prefFont').onchange = e => { prefs.fontsize = e.target.value; change(); };
  $('#prefLowfx').onchange = e => { prefs.lowfx = e.target.checked; change(); };
  $('#langPick').onchange = e => { prefs.lang = e.target.value; applyLang(); savePrefs(); route(); };
  $('#prefConfirm').onchange = e => { prefs.confirmDelete = e.target.checked; savePrefs(); };
  $('#prefSort').onchange = e => { prefs.sortPrio = e.target.checked; savePrefs(); };
  $('#prefCollapse').onchange = e => { prefs.collapseDone = e.target.checked; savePrefs(); };
  $('#prefSkip').onchange = e => { prefs.skipIntro = e.target.checked; savePrefs(); };
  $('#prefSound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); };
  $('#soundTest').onclick = playSoundNow;
}

/* ---------- Google Sheets import (public sheets: "Anyone with the link") ---------- */
async function fetchGoogleSheetCsv(url) {
  const m = url.match(/\/spreadsheets\/d\/(e\/)?([A-Za-z0-9_-]+)/); if (!m) throw new Error('bad_url');
  const g = (url.match(/[#&?]gid=(\d+)/) || [])[1], gq = g ? '&gid=' + g : '';
  const base = 'https://docs.google.com/spreadsheets/d/' + (m[1] || '') + m[2];
  const tries = m[1] ? [base + '/pub?output=csv' + gq]
    : [base + '/export?format=csv' + gq, base + '/gviz/tq?tqx=out:csv' + gq];
  for (const u of tries) {
    try {
      const r = await fetch(u, { credentials: 'omit' }); if (!r.ok) continue;
      const t = await r.text(); if (t && !/^\s*</.test(t)) return t;
    } catch (e) { /* try next */ }
  }
  throw new Error('fetch');
}
function importGoogleSheet() {
  modal(`<h3>${TE('gs_title')}</h3><p class="muted small">${TE('gs_hint')}</p>
    <input id="gsUrl" type="url" placeholder="${TE('gs_ph')}" style="width:100%" autocomplete="off">
    <div class="msg" id="gsMsg"></div>
    <div class="actions"><span class="spacer"></span><button class="btn" data-no>${TE('cancel')}</button><button class="btn primary" id="gsGo">${TE('gs_load')}</button></div>`,
  (m, close) => {
    const out = $('#gsMsg', m), inp = $('#gsUrl', m);
    $('[data-no]', m).onclick = close; inp.focus();
    const go = async () => {
      out.textContent = '';
      if (!/\/spreadsheets\/d\//.test(inp.value)) { out.textContent = T('gs_bad_url'); return; }
      $('#gsGo', m).disabled = true;
      try { const text = await fetchGoogleSheetCsv(inp.value.trim()); close(); await importCsvText(text); }
      catch (e) { out.textContent = T('gs_fail'); $('#gsGo', m).disabled = false; }
    };
    $('#gsGo', m).onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

/* ---------- Live updates (Realtime) + fallback refresh every 15 s while you are not typing ---------- */
let liveCh = null, liveTimer = null;
function startPolling() { stopPolling(); state.poll = setInterval(() => refreshCur(false), 15000); startLive(); }
function stopPolling() { clearInterval(state.poll); state.poll = null; state.needsRefresh = false; stopLive(); }
function startLive() {                       // Supabase Realtime for tasks (falls back to polling if not enabled)
  stopLive(); if (!sb || !state.cur || typeof sb.channel !== 'function') return;
  const id = state.cur.id;
  try {
    liveCh = sb.channel('tasks-' + id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tasks', filter: 'list_id=eq.' + id }, p => liveEvent('ins', p))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tasks', filter: 'list_id=eq.' + id }, p => liveEvent('upd', p))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'tasks' }, p => liveEvent('del', p))
      .subscribe();
  } catch (e) { liveCh = null; }
}
function stopLive() { clearTimeout(liveTimer); if (liveCh) { try { sb.removeChannel(liveCh); } catch (e) {} liveCh = null; } }
function liveEvent(kind, p) {
  const row = (p && p.new) || {}, old = (p && p.old) || {};
  if (kind === 'del') { if (!taskById(old.id)) return; }
  else { const l = taskById(row.id); if (l && sameTask(l, row)) return; }
  clearTimeout(liveTimer); liveTimer = setTimeout(() => refreshCur(true), 250);
}
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest('#sheetWrap'); };   // typing in the sheet is fine: drawTable keeps the focus
const ss = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : x);
const sameTask = (a, b) => a.done === b.done && a.title === b.title && a.notes === b.notes && a.sub_list_id === b.sub_list_id && a.position === b.position && ss(a.data || {}) === ss(b.data || {});
const sig = ts => JSON.stringify(ts.map(t => [t.id, t.done, t.title, t.notes, t.sub_list_id, t.position, ss(t.data || {})]).sort());

async function refreshCur(force) {
  if (!state.cur || !state.user) return;
  if (document.hidden && !force) return;
  if (pending.size || inflight || typing() || ctxEl || document.querySelector('.overlay')) { state.needsRefresh = true; return; }
  state.needsRefresh = false;
  const id = state.cur.id;
  const [lr, tr] = await Promise.all([
    sb.from('lists').select(LIST_COLS).eq('id', id).maybeSingle(),
    sb.from('tasks').select('*').eq('list_id', id).order('position')
  ]);
  if (!state.cur || state.cur.id !== id || lr.error || tr.error) return;
  if (!lr.data) { toast(T('list_gone'), true); await loadLists(); location.hash = '#/'; return; }
  if (pending.size || inflight || typing() || ctxEl || document.querySelector('.overlay')) { state.needsRefresh = true; return; }
  const meta = x => ss([x.title, x.columns, x.link_role]);
  const listChanged = meta(lr.data) !== meta(state.cur);
  const tasksChanged = sig(tr.data) !== sig(state.tasks);
  if (listChanged) Object.assign(state.cur, lr.data);
  if (tasksChanged) state.tasks = tr.data;
  if (listChanged) drawList(); else if (tasksChanged) drawTable();
}
