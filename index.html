<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1f2430; --muted:#6b7280; --line:#d9dde3; --head:#eef1f5;
  --accent:#2563eb; --accent-text:#fff; --danger:#dc2626; --done:#9aa1ad; --hover:#f3f6fb; --shadow:0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161a; --panel:#1c1f26; --text:#e6e8ec; --muted:#98a0ad; --line:#333844; --head:#242833;
        --accent:#5b8cff; --accent-text:#0b1020; --danger:#f26d6d; --done:#6b7280; --hover:#232834; --shadow:0 8px 30px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em}
.muted{color:var(--muted)} .small{font-size:12.5px}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .gap{gap:14px} .wrapx{flex-wrap:wrap}

/* Topbar */
.top{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:.02em;color:var(--text)} .brand:hover{text-decoration:none}
.tile{display:grid;place-items:center;background:#000;color:#fff;border-radius:9px;width:36px;height:36px}
.tile svg{width:26px;height:auto;display:block}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);padding:3px 8px 3px 3px;border-radius:99px} .me:hover{background:var(--hover);text-decoration:none}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-text);font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 60px} .wrap.wide{max-width:1500px} .wrap.narrow{max-width:640px}
@media (max-width:600px){.me span{display:none}}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--hover)} .btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;font-weight:600} .btn.danger.solid:hover{filter:brightness(1.08);background:var(--danger)}
.icon{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;opacity:.55} .icon:hover{opacity:1;background:var(--hover)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 2px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* Formulare */
label{display:block;margin:0 0 12px;font-weight:600;font-size:13.5px}
label input,label select{display:block;width:100%;margin-top:4px;font-weight:400}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input:disabled{opacity:.65}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
small{color:var(--muted);font-weight:400}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}

/* Auth */
.auth{max-width:400px;margin:5vh auto;padding:26px 28px 28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.logo-lock{display:flex;flex-direction:column;align-items:center;gap:4px;background:#000;color:#fff;border-radius:18px;padding:18px 28px 12px;width:fit-content;margin:0 auto 14px}
.logo-lock svg{width:110px;height:auto;display:block}
.logo-lock b{font:900 44px/1 "Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;letter-spacing:.03em}
.auth .tagline{text-align:center;margin:0 0 6px}
.langsel{display:flex;justify-content:flex-end;margin:-8px 0 6px} .langsel select{padding:3px 6px;font-size:13px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.notice{background:var(--head);border-radius:8px;padding:9px 12px;margin:12px 0;font-size:14px}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--danger)} .msg.ok{color:#16a34a} .msg.inline{margin:0}

/* Panels (Account) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.panel h3{font-size:16px;margin-bottom:12px}

/* Listenübersicht */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent)}
.card h3{font-size:16px;margin:0 0 4px;padding-right:28px;word-break:break-word}
.card .icon{position:absolute;top:8px;right:8px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);margin:10px 0 28px}

/* Brotkrumen + Titel */
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.h-input{font-size:24px;font-weight:700;border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;width:min(560px,80vw)}
.h-input:hover{border-color:var(--line)}
h2{font-size:24px}

/* Tabelle */
.sheet-wrap{margin-top:14px;overflow:auto;max-height:calc(100vh - 225px);min-height:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top;background:var(--panel)}
.sheet th{position:sticky;top:0;z-index:2;background:var(--head);font-size:13px;text-align:left;padding:8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet th .colbtn{border:0;background:none;cursor:pointer;float:right;opacity:.6;padding:0 4px;font-size:15px;line-height:1}
.sheet th .colbtn:hover{opacity:1}
.sheet th.c-chk,.sheet td.c-chk{text-align:center}
.sheet td.c-chk{padding-top:9px}
.sheet td.c-chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.sheet tr:hover td{background:var(--hover)}
.sheet textarea,.sheet td input[type=text],.sheet td input[type=number],.sheet td input[type=date]{
  width:100%;border:0;border-radius:0;background:transparent;padding:8px;resize:none;overflow:hidden;display:block;min-height:36px}
.sheet textarea:focus,.sheet td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--panel)}
.sheet td.c-bool{text-align:center;padding-top:9px} .sheet td.c-bool input{width:18px;height:18px;accent-color:var(--accent)}
.sheet td.c-sub{padding:7px 8px}
.sheet td.c-add{text-align:center}
.sheet tr.done textarea,.sheet tr.done input[type=number],.sheet tr.done input[type=date]{color:var(--done)}
.sheet tr.done textarea[data-f=title]{text-decoration:line-through}
.sheet tr.addrow td{padding:6px 10px} .sheet tr.addrow:hover td{background:var(--panel)}
.sheet tr.sep td{background:var(--head);font-size:12.5px;color:var(--muted);padding:5px 10px;font-weight:600}
.sheet tr.ctxrow td{background:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--head);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.lock{color:var(--muted)}
.sheet td.c-sub .icon{padding:1px 4px}

/* Kontextmenü */
.ctx{position:fixed;z-index:150;min-width:230px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer}
.ctx button:hover,.ctx button:focus{background:var(--hover);outline:none}
.ctx button.danger{color:var(--danger)}
.ctx .ic{width:18px;text-align:center;opacity:.8}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px;z-index:100;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;width:100%;max-width:520px}
.modal.small-modal{max-width:400px}
.modal h3{font-size:18px} .modal h4{margin:18px 0 6px;font-size:14px}
.actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;margin:8px 0 12px}
.pickitem{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer}
.pickitem:hover{border-color:var(--accent)}
.members{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.member{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.member span.nm{flex:1;word-break:break-all}
.linkrow{display:flex;gap:6px;margin-top:8px} .linkrow input{flex:1;min-width:0}

/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:200;display:none;align-items:center;gap:14px;max-width:90vw;box-shadow:var(--shadow)}
#toast.err{background:var(--danger);color:#fff}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* Intro / Splash */
#splash{position:fixed;inset:0;z-index:1000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-stage{display:flex;flex-direction:column;align-items:center;gap:2px}
.sp-bird{width:min(54vw,320px);height:auto;display:block;transform:translateY(-120vh);animation:spDrop .9s .1s forwards}
.sp-word{display:flex;font:900 clamp(72px,19vw,170px)/1 "Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;letter-spacing:.02em}
.sp-2{display:block;transform:translateX(-58vw);animation:spL .55s .85s forwards}
.sp-do{display:block;transform:translateX(58vw);animation:spR .55s .85s forwards}
.sp-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#splash.hit .sp-stage{animation:spShake .42s}
#splash.hit .sp-flash{animation:spFlash .4s}
@keyframes spDrop{
  0%{transform:translateY(-120vh);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  60%{transform:translateY(0);animation-timing-function:ease-out}
  76%{transform:translateY(-3.5vh);animation-timing-function:ease-in}
  88%{transform:translateY(0);animation-timing-function:ease-out}
  94%{transform:translateY(-.8vh);animation-timing-function:ease-in}
  100%{transform:translateY(0)}}
@keyframes spL{0%{transform:translateX(-58vw);animation-timing-function:cubic-bezier(.45,0,.85,.55)}72%{transform:translateX(0);animation-timing-function:ease-out}84%{transform:translateX(9px);animation-timing-function:ease-in-out}100%{transform:translateX(0)}}
@keyframes spR{0%{transform:translateX(58vw);animation-timing-function:cubic-bezier(.45,0,.85,.55)}72%{transform:translateX(0);animation-timing-function:ease-out}84%{transform:translateX(-9px);animation-timing-function:ease-in-out}100%{transform:translateX(0)}}
@keyframes spShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,1px)}}
@keyframes spFlash{0%{opacity:.4}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none!important;transform:none!important}
}
</style>

  if (!src || typeof src !== 'object') return;
  if (LANGS[src.lang]) prefs.lang = src.lang;
  if (typeof src.confirmDelete === 'boolean') prefs.confirmDelete = src.confirmDelete;
  if (typeof src.sound === 'boolean') prefs.sound = src.sound;
}
try { adoptPrefs(JSON.parse(localStorage.getItem(PREF_KEY) || 'null')); } catch (e) {}
const T = (k, v) => {
  let s = (I18N[prefs.lang] && I18N[prefs.lang][k]);
  if (s == null) s = I18N.en[k];
  if (s == null) s = k;
  return v ? s.replace(/\{(\w+)\}/g, (m, n) => (v[n] ?? '')) : s;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TE = (k, v) => esc(T(k, v));
const applyLang = () => { document.documentElement.lang = prefs.lang; };
applyLang();

function toast(msg, isErr, action) {
  const t = $('#toast'); t.className = isErr ? 'err' : ''; t.textContent = '';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (action) {
    const b = document.createElement('button'); b.textContent = action.label;
    b.onclick = () => { t.style.display = 'none'; action.fn(); }; t.appendChild(b);
  }
  t.style.display = 'flex'; clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, action ? 7000 : (isErr ? 5000 : 2200));
}

const DB_ERRS = [
  [/Nur der Besitzer/i, 'err_not_owner'], [/Keine Berechtigung/i, 'err_no_perm'],
  [/Konto "(.*)" wurde nicht gefunden/i, 'err_user_nf', m => ({ name: m[1] })],
  [/eigenes Konto/i, 'err_self'], [/Link ung.ltig/i, 'err_join']
];
function errText(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return T('err_login');
  if (/Email not confirmed/i.test(m)) return T('err_unconfirmed');
  if (/already registered/i.test(m)) return T('err_email_taken');
  if (/Password should be at least/i.test(m)) return T('err_pw_short');
  if (/rate limit|too many requests|security purposes/i.test(m)) return T('err_rate');
  if (/Database error saving new user/i.test(m)) return T('err_signup_db');
  if (/different from the old password/i.test(m)) return T('err_pw_same');
  if (/reauthentication/i.test(m)) return T('err_reauth');
  for (const [re, key, vars] of DB_ERRS) { const x = m.match(re); if (x) return T(key, vars ? vars(x) : null); }
  return m;
}

function modal(html, mount, onClose, extraCls) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${extraCls || ''}" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { if (!ov.isConnected) return; ov.remove(); if (onClose) onClose(); };
  ov._close = close;
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
  if (mount) mount(ov.firstElementChild, close);
  const f = ov.querySelector('input,select,textarea'); if (f) f.focus();
  return close;
}
function confirmBox(text, okLabel) {
  return new Promise(resolve => {
    modal(`<p style="margin:0 0 4px;font-size:16px">${esc(text)}</p>
      <div class="actions"><span class="spacer"></span><button class="btn" data-no>${TE('cancel')}</button>
      <button class="btn danger solid" data-yes>${esc(okLabel || T('delete'))}</button></div>`,
    (m, close) => {
      $('[data-no]', m).onclick = close;
      $('[data-yes]', m).onclick = () => { resolve(true); close(); };
      $('[data-yes]', m).focus();
    }, () => resolve(false), 'small-modal');
  });
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (ctxEl) { closeCtx(); return; }
  const o = [...document.querySelectorAll('.overlay')].pop(); if (o && o._close) o._close();
});

const AV_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
function avatarHTML(p, size) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .45)}px`;
  if (p && p.avatar && AV_RE.test(p.avatar)) return `<img class="av" style="${st}" src="${p.avatar}" alt="">`;
  const ch = ((p && p.username) || '?').trim().charAt(0).toUpperCase() || '?';
  return `<span class="av" style="${st}">${esc(ch)}</span>`;
}
function resizeToDataURL(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
      g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

async function setSession(session) {
  state.user = session ? session.user : null;
  state.profile = null; state.lists = []; state.memberRoles = {}; state.owners = {}; state.cur = null;
  if (state.user) {
    const mp = state.user.user_metadata && state.user.user_metadata.prefs;
    if (mp) { adoptPrefs(mp); try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} applyLang(); }
    const { data } = await sb.from('profiles').select('id,username,avatar').eq('id', state.user.id).maybeSingle();
    state.profile = data || { id: state.user.id, username: state.user.email };
    await loadLists();
  }
  state.ready = true;
}
function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
  if (sb && state.user) sb.auth.updateUser({ data: { prefs: { ...prefs } } }).then(r => { if (r.data && r.data.user) state.user = r.data.user; });
}

if (!sb) {
  renderSetup(); appReady();
} else {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { recoveryMode = true; if (state.ready) setTimeout(route, 0); }
    // don't await Supabase calls inside this callback → defer to the next tick
    setTimeout(async () => {
      const next = session ? session.user.id : null;
      const prev = state.user ? state.user.id : null;
      if (state.ready && prev === next) return;
      await setSession(session);
      try { await route(); } finally { appReady(); }
    }, 0);
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else refreshCur(true); });
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('focusout', () => { setTimeout(() => { if (state.needsRefresh) refreshCur(true); }, 60); });
}

async function loadLists() {
  const [l, m] = await Promise.all([
    sb.from('lists').select(LIST_COLS).order('created_at'),
    sb.from('list_members').select('list_id,role').eq('user_id', state.user.id)
  ]);
  if (l.error) { toast(errText(l.error), true); return; }
  state.lists = l.data || [];
  state.memberRoles = Object.fromEntries((m.data || []).map(x => [x.list_id, x.role]));
  const ids = [...new Set(state.lists.map(x => x.owner_id))].filter(id => id !== state.user.id && !state.owners[id]);
  if (ids.length) {
    const p = await sb.from('profiles').select('id,username').in('id', ids);
    (p.data || []).forEach(x => { state.owners[x.id] = x.username; });
  }
}
const roleOf = l => l.owner_id === state.user.id ? 'owner' : (state.memberRoles[l.id] || 'view');
const ownerName = l => l.owner_id === state.user.id ? T('you') : (state.owners[l.owner_id] || '?');
const roleLabel = r => T(r === 'owner' ? 'role_owner' : r === 'edit' ? 'role_edit' : 'role_view');

/* ---------- Routing ---------- */
async function route() {
  if (!state.ready) return;
  closeCtx();
  const seq = ++state.routeSeq;
  stopPolling(); flushAll();
  const [name, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (recoveryMode && state.user) return renderRecovery();
  if (name === 'join' && arg) {
    if (!state.user) { sessionStorage.setItem('pendingJoin', arg); return renderAuth(T('join_hint')); }
    return doJoin(arg);
  }
  if (!state.user) return renderAuth();
  const pj = sessionStorage.getItem('pendingJoin');
  if (pj) { sessionStorage.removeItem('pendingJoin'); return doJoin(pj); }
  if (name === 'account') { state.crumbs = []; state.cur = null; return renderAccount(); }
  if (name === 'list' && arg) {
    if (!state.keepCrumbs) state.crumbs = [];
    state.keepCrumbs = false;
    return renderList(arg, seq);
  }
  state.crumbs = []; state.cur = null;
  renderHome();
}

async function doJoin(token) {
  const { data, error } = await sb.rpc('join_list_by_token', { tok: token });
  if (error) { toast(T('err_join'), true); location.hash = '#/'; return; }
  await loadLists();
  location.hash = '#/list/' + data;
}

/* ---------- Login / sign-up / forgot password ---------- */
const lockHTML = () => `<div class="logo-lock">${birdSVG('')}<b>2DO</b></div>`;
const langSelectHTML = () => `<div class="langsel"><select id="langSel" aria-label="${TE('language')}">${
  Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === prefs.lang ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;

function renderAuth(msg = '') {
  document.title = 'TPC2Do';
  let mode = 'login';
  const draw = () => {
    const forgot = mode === 'forgot';
    app.innerHTML = `<div class="auth">${langSelectHTML()}${lockHTML()}
      <p class="muted tagline">${TE('tagline')}</p>
      ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
      ${forgot ? `<h3 style="margin-top:14px">${TE('reset_title')}</h3>` : `<div class="tabs">
        <button type="button" data-m="login" class="${mode === 'login' ? 'on' : ''}">${TE('tab_login')}</button>
        <button type="button" data-m="signup" class="${mode === 'signup' ? 'on' : ''}">${TE('tab_signup')}</button></div>`}
      <form id="authForm">
        <label>${TE('email')}<input type="email" name="email" required autocomplete="email"></label>
        ${mode === 'signup' ? `<label>${TE('username')}<input name="username" required maxlength="24" autocomplete="username">
          <small>${TE('username_hint')}</small></label>` : ''}
        ${forgot ? '' : `<label>${TE('password')}<input type="password" name="password" required minlength="8" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}"></label>`}
        <button class="btn primary" style="width:100%" type="submit">${forgot ? TE('reset_send') : mode === 'login' ? TE('btn_login') : TE('btn_signup')}</button>
        <div id="authMsg" class="msg"></div>
        ${mode === 'login' ? `<button type="button" class="linkbtn" id="toForgot">${TE('forgot')}</button>` : ''}
        ${forgot ? `<button type="button" class="linkbtn" id="toLogin">${TE('back_login')}</button>` : ''}
      </form></div>`;
    $('#langSel').onchange = e => { prefs.lang = e.target.value; applyLang(); savePrefs(); draw(); };
    app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    const tf = $('#toForgot'); if (tf) tf.onclick = () => { mode = 'forgot'; draw(); };
    const tl = $('#toLogin'); if (tl) tl.onclick = () => { mode = 'login'; draw(); };
    const form = $('#authForm'), out = $('#authMsg'), btn = $('button[type=submit]', form);
    form.onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(form), email = f.get('email').trim(), password = f.get('password');
      btn.disabled = true; out.className = 'msg'; out.textContent = '';
      try {
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else if (forgot) {
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
          if (error) throw error;
          out.className = 'msg ok'; out.textContent = T('reset_sent');
        } else {
          const username = f.get('username').trim();
          if (!/^[A-Za-z0-9_.-]{3,24}$/.test(username)) throw new Error(T('err_username_invalid'));
          const av = await sb.rpc('username_available', { uname: username });
          if (av.error) throw av.error;
          if (!av.data) throw new Error(T('err_username_taken'));
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, prefs: { ...prefs } }, emailRedirectTo: pageUrl() } });
          if (error) throw error;
          if (!data.session) { out.className = 'msg ok'; out.textContent = T('signup_ok'); }
        }
      } catch (err) { out.textContent = errText(err); }
      btn.disabled = false;
    };
  };
  draw();
}

function renderRecovery() {
  document.title = 'TPC2Do';
  app.innerHTML = `<div class="auth">${lockHTML()}<h3 style="margin-top:6px">${TE('rec_title')}</h3>
    <form id="recForm">
      <label>${TE('pw_new')}<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label>${TE('pw_confirm')}<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
      <small>${TE('pw_hint')}</small>
      <button class="btn primary" style="width:100%;margin-top:12px" type="submit">${TE('rec_btn')}</button>
      <div id="recMsg" class="msg"></div></form></div>`;
  const form = $('#recForm'), out = $('#recMsg');
  form.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(form), pw = f.get('pw'), pw2 = f.get('pw2');
    out.className = 'msg'; out.textContent = '';
    if (pw.length < 8) { out.textContent = T('err_pw_short'); return; }
    if (pw !== pw2) { out.textContent = T('err_pw_mismatch'); return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { out.textContent = errText(error); return; }
    recoveryMode = false; toast(T('rec_done')); location.hash = '#/'; route();
  };
}

/* ---------- List view ---------- */
const pending = new Map();         // taskId -> {patch, timer}
const insertPromises = new Map();  // taskId -> Promise (insert still running)
let inflight = 0;

async function renderList(id, seq) {
  app.innerHTML = topbar() + `<main class="wrap"><p class="muted">${TE('loading')}</p></main>`; bindTop();
  let list = state.lists.find(l => l.id === id);
  if (!list) { await loadLists(); list = state.lists.find(l => l.id === id); }
  if (seq !== state.routeSeq) return;
  if (!list) {
    app.innerHTML = topbar() + `<main class="wrap"><h2>${TE('nf_title')}</h2>
      <p class="muted">${TE('nf_text')}</p><a class="btn" href="#/">${TE('nf_back')}</a></main>`;
    bindTop(); return;
  }
  const { data, error } = await sb.from('tasks').select('*').eq('list_id', id).order('position');
  if (seq !== state.routeSeq) return;
  if (error) { toast(errText(error), true); return; }
  state.cur = list; state.role = roleOf(list); state.tasks = data || [];
  document.title = list.title + ' – TPC2Do';
  drawList(); startPolling();
}

const undoneTasks = () => state.tasks.filter(t => !t.done).sort((a, b) => a.position - b.position);
const doneTasks = () => state.tasks.filter(t => t.done)
  .sort((a, b) => new Date(b.done_at || b.created_at).getTime() - new Date(a.done_at || a.created_at).getTime());
const taskById = id => state.tasks.find(t => t.id === id);
const colById = id => (state.cur.columns || []).find(c => c.id === id);

function drawList() {
  const l = state.cur, owner = state.role === 'owner';
  const crumbs = state.crumbs.map((c, i) => `<a href="#/list/${c.id}" data-crumb="${i}">${esc(c.title)}</a>`).join(' › ');
  app.innerHTML = topbar() + `<main class="wrap wide">
    <nav class="crumbs"><a href="#/">${TE('my_lists')}</a> › ${crumbs ? crumbs + ' › ' : ''}<span>${esc(l.title)}</span></nav>
    <div class="row between wrapx">
      <div>${owner ? `<input id="listTitle" class="h-input" value="${esc(l.title)}" maxlength="120" aria-label="${TE('name')}">` : `<h2>${esc(l.title)}</h2>`}</div>
      <div class="row gap"><span class="badge">${TE(state.role === 'owner' ? 'role_owner' : state.role === 'edit' ? 'role_edit' : 'role_view')}</span><span id="saveState" class="muted small"></span>
        ${owner ? `<button class="btn" id="shareBtn">${TE('share')}</button>` : ''}</div>
    </div>
    <div class="sheet-wrap" id="sheetWrap"></div>
    <p class="muted small" id="counter"></p>
    ${state.role !== 'view' ? `<p class="muted small">${TE('hint_ctx')}</p>` : ''}

function tableHTML() {
  const cols = state.cur.columns || [], ro = state.role === 'view';
  const W = { chk: 46, task: 330, notes: 280, sub: 220, custom: 170, add: 46 };
  const widths = [W.chk, W.task, W.notes, W.sub, ...cols.map(() => W.custom), ...(ro ? [] : [W.add])];
  const total = widths.reduce((a, b) => a + b, 0);
  const head = `<thead><tr><th class="c-chk" title="${TE('done')}">✓</th><th>${TE('c_task')}</th><th>${TE('c_notes')}</th><th>${TE('c_sub')}</th>
    ${cols.map(c => `<th title="${esc(c.name)}">${esc(c.name)}${ro ? '' : `<button class="colbtn" data-act="editcol" data-col="${c.id}" title="${TE('col_edit_tip')}">⋯</button>`}</th>`).join('')}
    ${ro ? '' : `<th class="c-add"><button class="colbtn" style="float:none;opacity:1;font-size:18px" data-act="addcol" title="${TE('col_add_tip')}">＋</button></th>`}</tr></thead>`;
  const un = undoneTasks(), dn = doneTasks(), ncols = widths.length;
  let body = un.map(rowHTML).join('');
  if (!ro) body += `<tr class="addrow"><td></td><td colspan="${ncols - 1}"><button class="linkbtn" data-act="addtask">${TE('add_task')}</button></td></tr>`;
  if (dn.length) body += `<tr class="sep"><td colspan="${ncols}">${TE('done_hdr', { n: dn.length })}</td></tr>` + dn.map(rowHTML).join('');
  return `<table class="sheet" style="width:${total}px"><colgroup>${widths.map(w => `<col style="width:${w}px">`).join('')}</colgroup>${head}<tbody>${body}</tbody></table>`;
}

function rowHTML(t) {
  const cols = state.cur.columns || [], ro = state.role === 'view', dis = ro ? 'readonly' : '';
  return `<tr data-id="${t.id}" class="${t.done ? 'done' : ''}">

function subCell(t, ro) {
  if (t.sub_list_id) {
    const sl = state.lists.find(l => l.id === t.sub_list_id);
    const chip = sl
      ? `<a class="chip" href="#/list/${sl.id}" data-act="opensub" data-sub="${sl.id}" title="${esc(sl.title)}">📋 ${esc(sl.title)} →</a>`
      : `<span class="chip lock" title="${TE('no_access_tip')}">🔒 ${TE('no_access')}</span>`;
    return chip + (ro ? '' : `<button class="icon" data-act="unlinksub" title="${TE('unlink_tip')}">✕</button>`);
  }
  return ro ? '' : `<button class="linkbtn" data-act="linksub">${TE('link_sub')}</button>`;
}

function customCell(t, c, ro) {
  const v = t.data ? t.data[c.id] : undefined;
  if (c.type === 'checkbox') return `<td class="c-bool"><input type="checkbox" data-cf="${c.id}" ${v ? 'checked' : ''} ${ro ? 'disabled' : ''}></td>`;
  if (c.type === 'number') return `<td><input type="number" step="any" data-cf="${c.id}" value="${esc(v ?? '')}" ${ro ? 'readonly' : ''}></td>`;
  if (c.type === 'date') return `<td><input type="date" data-cf="${c.id}" value="${esc(v ?? '')}" ${ro ? 'readonly' : ''}></td>`;
  return `<td><textarea rows="1" data-cf="${c.id}" ${ro ? 'readonly' : ''}>${esc(v ?? '')}</textarea></td>`;
}

function fit(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function drawTable() {
  const wrap = $('#sheetWrap'); if (!wrap) return;
  const sl = wrap.scrollLeft, st = wrap.scrollTop;
  wrap.innerHTML = tableHTML();
  wrap.scrollLeft = sl; wrap.scrollTop = st;
  wrap.querySelectorAll('textarea').forEach(fit);
  const c = $('#counter'); if (c) c.textContent = T('counts', { open: undoneTasks().length, done: doneTasks().length });
}
window.addEventListener('resize', () => document.querySelectorAll('#sheetWrap textarea').forEach(fit));

/* ---------- Right-click / long-press menu ---------- */
let ctxEl = null;
function closeCtx() {
  if (ctxEl) { ctxEl.remove(); ctxEl = null; }
  document.querySelectorAll('tr.ctxrow').forEach(r => r.classList.remove('ctxrow'));
}
function openCtx(x, y, task) {
  closeCtx();
  const ro = state.role === 'view', items = [];
  const sub = task.sub_list_id ? state.lists.find(l => l.id === task.sub_list_id) : null;
  if (!ro) {
    items.push({ ic: task.done ? '↩' : '✓', k: task.done ? 'cm_open' : 'cm_done', fn: () => toggleDone(task) });
    if (!task.done) items.push(
      { ic: '↑', k: 'cm_above', fn: () => addTask(task.id, 'above') },
      { ic: '↓', k: 'cm_below', fn: () => addTask(task.id, 'below') },
      { ic: '⧉', k: 'cm_dup', fn: () => duplicateTask(task) });
    items.push('-');
  }
  if (sub) items.push({ ic: '↗', k: 'cm_goto', fn: () => openSub(sub.id) });
  if (!ro) {
    items.push(task.sub_list_id ? { ic: '✕', k: 'cm_unlink', fn: () => unlinkSub(task) } : { ic: '🔗', k: 'cm_link', fn: () => subModal(task) });
    items.push('-', { ic: '🗑', k: 'cm_delete', danger: true, fn: () => askDeleteTask(task) });
  }
  const clean = items.filter((it, i, a) => !(it === '-' && (i === 0 || a[i - 1] === '-' || i === a.length - 1)));
  if (!clean.length) return false;
  const m = document.createElement('div'); m.className = 'ctx'; m.setAttribute('role', 'menu');
  clean.forEach(it => {
    if (it === '-') { m.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
    if (it.danger) b.className = 'danger';
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = it.ic;
    const tx = document.createElement('span'); tx.textContent = T(it.k);
    b.append(ic, tx);
    b.onclick = () => { closeCtx(); it.fn(); };
    m.appendChild(b);
  });
  m.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus();
  });
  document.body.appendChild(m); ctxEl = m;
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(6, Math.min(x, innerWidth - r.width - 6)) + 'px';
  m.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 6)) + 'px';
  const row = $(`tr[data-id="${task.id}"]`); if (row) row.classList.add('ctxrow');
  m.querySelector('button').focus();
  return true;
}
document.addEventListener('pointerdown', e => { if (ctxEl && !ctxEl.contains(e.target)) closeCtx(); }, true);
window.addEventListener('scroll', () => { if (ctxEl) closeCtx(); }, true);
window.addEventListener('resize', () => { if (ctxEl) closeCtx(); });

function bindSheet(wrap) {
  wrap.addEventListener('input', e => {
    const el = e.target, tr = el.closest('tr[data-id]'); if (!tr) return;
    const t = taskById(tr.dataset.id); if (!t) return;
    if (el.dataset.f === 'title' || el.dataset.f === 'notes') {
      t[el.dataset.f] = el.value; queueSave(t.id, { [el.dataset.f]: el.value }); fit(el);
    } else if (el.dataset.cf) {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
      t.data = { ...(t.data || {}), [el.dataset.cf]: v };
      queueSave(t.id, { data: t.data });
      if (el.tagName === 'TEXTAREA') fit(el);
    }
  });
  wrap.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f !== 'done') return;
    const t = taskById(el.closest('tr').dataset.id); if (!t) return;
    setDone(t, el.checked);
  });
  wrap.addEventListener('keydown', e => {
    const el = e.target;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && el.dataset.f === 'title' && state.role !== 'view') {
      e.preventDefault();
      const t = taskById(el.closest('tr').dataset.id);
      if (t && !t.done) addTask(t.id, 'below');
    }
  });
  wrap.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const tr = b.closest('tr[data-id]'), t = tr ? taskById(tr.dataset.id) : null;
    switch (b.dataset.act) {
      case 'addtask': addTask(); break;
      case 'linksub': if (t) subModal(t); break;
      case 'unlinksub': if (t) unlinkSub(t); break;
      case 'opensub': e.preventDefault(); openSub(b.dataset.sub); break;
      case 'addcol': colModal(); break;
      case 'editcol': colModal(colById(b.dataset.col)); break;
    }
  });
  // right-click (desktop, Android long-press)
  wrap.addEventListener('contextmenu', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const el = e.target;
    try { if ((el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') && el.selectionStart != null && el.selectionStart !== el.selectionEnd) return; } catch (x) {}
    const t = taskById(tr.dataset.id); if (!t) return;
    if (openCtx(e.clientX, e.clientY, t)) e.preventDefault();
  });
  // long-press for touch devices without a contextmenu event (iOS)
  let lp = null;
  wrap.addEventListener('touchstart', e => {
    const tr = e.target.closest('tr[data-id]');
    if (!tr || /^(TEXTAREA|INPUT|BUTTON|A|SELECT)$/.test(e.target.tagName)) return;
    const p = e.touches[0];
    lp = setTimeout(() => { lp = null; const t = taskById(tr.dataset.id); if (t) { if (navigator.vibrate) navigator.vibrate(15); openCtx(p.clientX, p.clientY, t); } }, 550);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => wrap.addEventListener(ev, () => { clearTimeout(lp); lp = null; }, { passive: true }));
}

function openSub(id) {
  state.crumbs.push({ id: state.cur.id, title: state.cur.title });
  state.keepCrumbs = true;
  location.hash = '#/list/' + id;
}
function unlinkSub(t) { t.sub_list_id = null; queueSave(t.id, { sub_list_id: null }, 0); drawTable(); }
function setDone(t, val) {
  t.done = val; t.done_at = val ? new Date().toISOString() : null;
  queueSave(t.id, { done: t.done, done_at: t.done_at }, 0);
  drawTable();
}
function toggleDone(t) { setDone(t, !t.done); }

/* ---------- Saving ---------- */
function updateStatus() {
  const s = $('#saveState'); if (!s) return;
  s.textContent = (pending.size || inflight) ? T('saving') : T('saved');
}
function queueSave(id, patch, delay = 600) {
  const p = pending.get(id) || { patch: {}, timer: null };
  Object.assign(p.patch, patch); clearTimeout(p.timer);
  p.timer = setTimeout(() => flush(id), delay);
  pending.set(id, p); updateStatus();
}
async function flush(id) {
  const p = pending.get(id); if (!p) return;
  pending.delete(id); clearTimeout(p.timer);
  inflight++; updateStatus();
  try {
    if (insertPromises.has(id)) await insertPromises.get(id);
    const { error } = await sb.from('tasks').update(p.patch).eq('id', id);
    if (error) toast(T('save_fail', { msg: errText(error) }), true);
  } finally {
    inflight--; updateStatus();
    if (!pending.size && !inflight && state.needsRefresh) refreshCur(true);
  }
}
function flushAll() { [...pending.keys()].forEach(flush); }
async function flushAllWait() {
  flushAll();
  for (let i = 0; i < 50 && (pending.size || inflight); i++) await new Promise(r => setTimeout(r, 100));
}

/* ---------- Tasks ---------- */
function posFor(refId, where) {
  const un = undoneTasks(), i = un.findIndex(x => x.id === refId);
  if (i < 0) return state.tasks.reduce((m, x) => Math.max(m, x.position), 0) + 1;
  const cur = un[i];
  if (where === 'above') { const prv = un[i - 1]; return prv ? (prv.position + cur.position) / 2 : cur.position - 1; }
  const nxt = un[i + 1]; return nxt ? (cur.position + nxt.position) / 2 : cur.position + 1;
}
async function addTask(refId, where = 'below', init = {}) {
  const pos = refId ? posFor(refId, where) : state.tasks.reduce((m, x) => Math.max(m, x.position), 0) + 1;
  const t = Object.assign({ id: uuid(), list_id: state.cur.id, done: false, title: '', notes: '', sub_list_id: null, data: {},
    created_at: new Date().toISOString(), done_at: null }, init, { position: pos });
  await insertTask(t, true);
}
async function insertTask(t, focus) {
  state.tasks.push(t); drawTable();
  if (focus) { const el = $(`tr[data-id="${t.id}"] textarea[data-f="title"]`); if (el) el.focus(); }
  const payload = { id: t.id, list_id: t.list_id, position: t.position, done: t.done, done_at: t.done_at,
    title: t.title, notes: t.notes, sub_list_id: t.sub_list_id, data: t.data };
  const ins = sb.from('tasks').insert(payload).then(r => r);
  insertPromises.set(t.id, ins);
  const { error } = await ins;
  insertPromises.delete(t.id);
  if (error) {
    toast(T('create_fail', { msg: errText(error) }), true);
    pending.delete(t.id); state.tasks = state.tasks.filter(x => x.id !== t.id); drawTable();
  }
}
function duplicateTask(t) {
  addTask(t.id, 'below', { title: t.title, notes: t.notes, sub_list_id: t.sub_list_id, data: JSON.parse(JSON.stringify(t.data || {})) });
}
const isEmptyTask = t => !t.title && !t.notes && !t.sub_list_id && !Object.values(t.data || {}).some(v => v !== '' && v != null && v !== false);

async function askDeleteTask(t) {
  const empty = isEmptyTask(t);
  if (prefs.confirmDelete && !empty && !(await confirmBox(T('confirm_task')))) return;
  const snap = JSON.parse(JSON.stringify(t));
  await deleteTask(t);
  if (!prefs.confirmDelete && !empty) toast(T('task_deleted'), false, { label: T('undo'), fn: () => {
    if (state.cur && state.cur.id === snap.list_id) insertTask(snap, false);
  } });
}
async function deleteTask(t) {
  const p = pending.get(t.id); if (p) { clearTimeout(p.timer); pending.delete(t.id); }
  state.tasks = state.tasks.filter(x => x.id !== t.id); drawTable(); updateStatus();
  if (insertPromises.has(t.id)) await insertPromises.get(t.id);
  const { error } = await sb.from('tasks').delete().eq('id', t.id);
  if (error) { toast(T('delete_fail', { msg: errText(error) }), true); refreshCur(true); }
}

async function loadMembers(lid) {
  const r = await sb.from('list_members').select('user_id,role').eq('list_id', lid);
  const rows = r.data || []; if (!rows.length) return [];
  const p = await sb.from('profiles').select('id,username,avatar').in('id', rows.map(x => x.user_id));
  const by = Object.fromEntries((p.data || []).map(x => [x.id, x]));
  return rows.map(x => ({ ...x, username: (by[x.user_id] || {}).username || '?', avatar: (by[x.user_id] || {}).avatar }))
    .sort((a, b) => a.username.localeCompare(b.username));
}

      box.innerHTML = members.length ? members.map(x => `<div class="member" data-uid="${x.user_id}">${avatarHTML(x, 24)}<span class="nm">${esc(x.username)}</span>
        <select data-mrole><option value="edit" ${x.role === 'edit' ? 'selected' : ''}>${TE('r_edit')}</option><option value="view" ${x.role === 'view' ? 'selected' : ''}>${TE('r_view')}</option></select>
        <button class="icon" data-mrm title="${TE('remove')}">✕</button></div>`).join('')
        : `<p class="muted small">${TE('nobody')}</p>`;
      box.querySelectorAll('.member').forEach(row => {
        const uid = row.dataset.uid;
        $('[data-mrole]', row).onchange = async e => {
          const { error } = await sb.from('list_members').update({ role: e.target.value }).eq('list_id', l.id).eq('user_id', uid);
          if (error) toast(errText(error), true); else members.find(x => x.user_id === uid).role = e.target.value;
        };
        $('[data-mrm]', row).onclick = async () => {
          const { error } = await sb.from('list_members').delete().eq('list_id', l.id).eq('user_id', uid);
          if (error) return toast(errText(error), true);
          members = members.filter(x => x.user_id !== uid); drawMembers();
        };
      });
    };
    drawMembers();

    const add = async () => {
      const name = $('#shUser', m).value.trim(); if (!name) return;
      const { error } = await sb.rpc('share_with_username', { lid: l.id, uname: name, r: $('#shRole', m).value });
      if (error) return toast(errText(error), true);
      $('#shUser', m).value = ''; members = await loadMembers(l.id); drawMembers(); toast(T('shared_ok'));
    };
    $('#shAdd', m).onclick = add;
    $('#shUser', m).addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  });
}

/* ---------- Account page ---------- */
function renderAccount() {
  const p = state.profile || {}, email = state.user.email || '';
  document.title = T('acc_title') + ' – TPC2Do';
  app.innerHTML = topbar() + `<main class="wrap narrow">
    <nav class="crumbs"><a href="#/">${TE('my_lists')}</a> › <span>${TE('acc_title')}</span></nav>
    <h2>${TE('acc_title')}</h2>

    <section class="panel"><h3>${TE('acc_profile')}</h3>
      <div class="row gap wrapx"><div>${avatarHTML(p, 84)}</div>
        <div><div class="row wrapx"><button class="btn" id="avUp">${TE('acc_upload')}</button>${p.avatar ? `<button class="btn" id="avRm">${TE('acc_remove')}</button>` : ''}</div>
          <input type="file" id="avFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div></div>
      <label style="margin-top:16px">${TE('acc_email')}<input value="${esc(email)}" disabled></label>
      <label>${TE('acc_username')}<input id="unameIn" value="${esc(p.username || '')}" maxlength="24" autocomplete="off"></label>
      <div class="actions"><button class="btn primary" id="unameSave">${TE('save')}</button><span id="unameMsg" class="msg inline"></span></div>
    </section>

    <section class="panel"><h3>${TE('language')}</h3>
      <select id="langPick">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === prefs.lang ? 'selected' : ''}>${v}</option>`).join('')}</select>
    </section>

    <section class="panel"><h3>${TE('acc_prefs')}</h3>
      <label class="check"><input type="checkbox" id="prefConfirm" ${prefs.confirmDelete ? 'checked' : ''}>${TE('pref_confirm')}</label>
      <div class="row wrapx"><label class="check" style="margin:0"><input type="checkbox" id="prefSound" ${prefs.sound ? 'checked' : ''}>${TE('pref_sound')}</label>
        <button class="btn" id="soundTest">🔊 ${TE('pref_sound_test')}</button></div>
    </section>

    <section class="panel"><h3>${TE('acc_password')}</h3>
      <form id="pwForm">
        <label>${TE('pw_current')}<input type="password" name="cur" required autocomplete="current-password"></label>
        <label>${TE('pw_new')}<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
        <label>${TE('pw_confirm')}<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
        <small>${TE('pw_hint')}</small>
        <div class="actions"><button class="btn primary" type="submit">${TE('pw_change')}</button><span id="pwMsg" class="msg inline"></span></div>
      </form>
      <p style="margin:16px 0 0"><button class="linkbtn" id="pwMail">${TE('pw_forgot', { email })}</button></p>
    </section>
  </main>`;
  bindTop();

  const fileIn = $('#avFile');
  $('#avUp').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; if (!f) return;
    try { await saveAvatar(await resizeToDataURL(f, 160)); } catch (e) { toast(T('err_avatar'), true); }
  };
  const rm = $('#avRm'); if (rm) rm.onclick = () => saveAvatar(null);
  async function saveAvatar(dataUrl) {
    const { error } = await sb.from('profiles').update({ avatar: dataUrl }).eq('id', state.user.id);
    if (error) return toast(errText(error), true);
    state.profile.avatar = dataUrl; renderAccount();
  }

  $('#unameSave').onclick = async () => {
    const out = $('#unameMsg'), v = $('#unameIn').value.trim(); out.className = 'msg inline'; out.textContent = '';
    if (!/^[A-Za-z0-9_.-]{3,24}$/.test(v)) { out.textContent = T('err_username_invalid'); return; }
    if (v === state.profile.username) { out.className = 'msg inline ok'; out.textContent = T('acc_saved'); return; }
    const { error } = await sb.from('profiles').update({ username: v }).eq('id', state.user.id);
    if (error) { out.textContent = error.code === '23505' ? T('err_username_taken') : error.code === '23514' ? T('err_username_invalid') : errText(error); return; }
    state.profile.username = v; renderAccount(); toast(T('acc_saved'));
  };

  $('#langPick').onchange = e => { prefs.lang = e.target.value; applyLang(); savePrefs(); route(); };
  $('#prefConfirm').onchange = e => { prefs.confirmDelete = e.target.checked; savePrefs(); };
  $('#prefSound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); };
  $('#soundTest').onclick = () => {
    const a = document.getElementById('intro-sound');
    a.currentTime = 0;
    a.play().catch(() => {});
  };   

  const pwForm = $('#pwForm'), pwMsg = $('#pwMsg');
  pwForm.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(pwForm), cur = f.get('cur'), pw = f.get('pw'), pw2 = f.get('pw2');
    pwMsg.className = 'msg inline'; pwMsg.textContent = '';
    if (pw.length < 8) { pwMsg.textContent = T('err_pw_short'); return; }
    if (pw !== pw2) { pwMsg.textContent = T('err_pw_mismatch'); return; }
    const chk = await sb.auth.signInWithPassword({ email: state.user.email, password: cur });
    if (chk.error) { pwMsg.textContent = T('err_pw_current'); return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { pwMsg.textContent = errText(error); return; }
    pwForm.reset(); pwMsg.className = 'msg inline ok'; pwMsg.textContent = T('pw_changed');
  };
  $('#pwMail').onclick = async () => {
    const { error } = await sb.auth.resetPasswordForEmail(state.user.email, { redirectTo: pageUrl() });
    if (error) return toast(errText(error), true);
    toast(T('pw_mail_sent', { email: state.user.email }));
  };
}

/* ---------- Auto refresh (every 8 s while you are not typing) ---------- */
function startPolling() { stopPolling(); state.poll = setInterval(() => refreshCur(false), 8000); }
function stopPolling() { clearInterval(state.poll); state.poll = null; state.needsRefresh = false; }
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
const sig = ts => JSON.stringify(ts.map(t => [t.id, t.done, t.title, t.notes, t.sub_list_id, t.position, t.data]).sort());

async function refreshCur(force) {
  if (!state.cur || !state.user) return;
  if (document.hidden && !force) return;
  if (pending.size || inflight || typing() || ctxEl || document.querySelector('.overlay')) { state.needsRefresh = true; return; }
  state.needsRefresh = false;
  const id = state.cur.id;
  const [lr, tr] = await Promise.all([
    sb.from('lists').select(LIST_COLS).eq('id', id).maybeSingle(),
    sb.from('tasks').select('*').eq('list_id', id).order('position')
  ]);
  if (!state.cur || state.cur.id !== id || lr.error || tr.error) return;
  if (!lr.data) { toast(T('list_gone'), true); await loadLists(); location.hash = '#/'; return; }
  if (pending.size || inflight || typing() || ctxEl || document.querySelector('.overlay')) { state.needsRefresh = true; return; }
  const meta = x => JSON.stringify([x.title, x.columns, x.link_role]);
  const listChanged = meta(lr.data) !== meta(state.cur);
  const tasksChanged = sig(tr.data) !== sig(state.tasks);
  if (listChanged) Object.assign(state.cur, lr.data);
  if (tasksChanged) state.tasks = tr.data;
  if (listChanged) drawList(); else if (tasksChanged) drawTable();
}
</script>
